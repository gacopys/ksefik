# Testy end-to-end z publicznym, testowym środowiskiem KSeF (api-test.ksef.mf.gov.pl).
# Każdy przebieg tworzy nowe, fikcyjne firmy - nie potrzeba żadnych sekretów ani prawdziwych danych.
# Działa co noc i na żądanie, a nie w każdym PR, żeby awaria środowiska testowego KSeF nie blokowała zmian.
name: Testy z KSeF

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: 'Argumenty pytest, np. -k test_06'
        required: false
        default: ""

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  e2e:
    name: End-to-end (testowy KSeF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
      - run: make install
      - name: Testy end-to-end
        env:
          ARGS: ${{ inputs.args }}
        run: make run-integration-test ARGS="--junitxml=reports/integration.xml $ARGS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-logs
          path: |
            integration-logs/
            reports/
          retention-days: 14
