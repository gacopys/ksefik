# Wydanie: `git tag v0.3.0 && git push origin v0.3.0`.
# Buduje paczkę, publikuje ją na PyPI (trusted publishing, bez tokenów) i tworzy GitHub Release.
name: Wydanie

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Paczka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - name: Wersja w tagu zgodna z pyproject.toml
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME nie pasuje do wersji $version w pyproject.toml"; exit 1
          fi
      - run: make install
      - run: make check
      - run: make build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publikacja na PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ksefik/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
