name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint i formatowanie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
      - run: make install
      - run: make lint

  test:
    name: Testy (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
      - run: make install
      - run: make test

  coverage:
    name: Pokrycie kodu
    runs-on: ubuntu-latest
    permissions:
      contents: write # odznaka pokrycia na gałęzi python-coverage-comment-action-data
      pull-requests: write # komentarz z pokryciem w PR
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
      - run: make install
      - run: make coverage
      - name: Odznaka i komentarz z pokryciem
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80
      - name: Komentarz dla PR z forka (publikuje go coverage-comment.yml)
        uses: actions/upload-artifact@v7
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: htmlcov
          path: htmlcov/
          retention-days: 14

  build:
    name: Paczka (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
      - run: make build
      - name: Sprawdź metadane paczki (README na PyPI)
        run: uvx twine check --strict dist/*
      - name: Instalacja z wheel i uruchomienie
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/ksefik --version
          /tmp/smoke/bin/ksefik --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
